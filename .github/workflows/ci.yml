name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # mlx 계열은 Apple Silicon 전용이라 CI(ubuntu)에서는 웹 계층 핀만 설치
        run: pip install $(grep -E '^(fastapi|uvicorn)==' requirements-runtime.txt) -r requirements-test.txt

      - name: Run tests
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Proxy integration test
        run: python tests/test_proxy.py

      - name: Coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        if: github.event_name == 'pull_request'
        with:
          pytest-xml-coverage-path: ./coverage.xml
